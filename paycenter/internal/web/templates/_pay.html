{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/pay.css">
</head>
<body>
<div class="box">
{{template "content" .}}
</div>
<script src="/static/pay.js"></script>
</body>
</html>{{end}}

{{define "summary"}}
<div class="sum">
  <div class="muted">{{.Order.Subject}}</div>
  <div class="amt">¥{{yuan .Order.Amount}}</div>
  <div class="muted small">订单号 {{.Order.OutTradeNo}}</div>
</div>
{{end}}

{{define "poll"}}<div id="poll" data-status="/pay/{{.Order.TradeNo}}/status?t={{.Token}}" data-done="/pay/{{.Order.TradeNo}}/return?t={{.Token}}"></div>{{end}}
